name: Release wiki

# Keeps rolling "Prod Release N" pages in the repo wiki.
#   stage-deployed <tag>: open page lists PRs from the last prod tag up to <tag>
#   prod-deployed  <tag>: stamps the open page with the prod deploy date and opens the next page
#
# Triggered by a repository_dispatch from the deploy system (e.g. after a Slack "Deploy" button
# finishes), or manually from the Actions tab.

on:
  repository_dispatch:
    types: [stage-deployed, prod-deployed]
  workflow_dispatch:
    inputs:
      event:
        description: Deploy event
        type: choice
        options: [stage-deployed, prod-deployed]
        required: true
      tag:
        description: Deployed tag (e.g. v1.2.0)
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-wiki
  cancel-in-progress: false

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT: ${{ github.event.action || inputs.event }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          [ -n "$TAG" ] || { echo "::error::No tag provided"; exit 1; }
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null \
            || { echo "::error::Tag $TAG not found"; exit 1; }

      - name: Clone wiki
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Update release pages
        run: python3 .github/scripts/release_wiki.py "$EVENT" "$TAG"

      - name: Push wiki
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "$EVENT: $TAG"
          git push
